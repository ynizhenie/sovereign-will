<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sovereign Will</title>

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="main-menu">
    <!-- the main menu has screens (showMenuScreen in main.js): modes, Endless setup, Settings -->
    <div class="main-menu-content" data-screen="home">
        <h1>Sovereign Will</h1>
        <button id="mode-endless" class="menu-button menu-button-primary" data-i18n="menu.endless">Endless</button>
        <button id="mode-battles" class="menu-button" disabled><span data-i18n="menu.battles">Battles</span> · <small data-i18n="menu.soon">soon</small></button>
        <button id="mode-editor" class="menu-button" disabled><span data-i18n="menu.editor">Map editor</span> · <small data-i18n="menu.soon">soon</small></button>
        <button id="open-settings" class="menu-button" data-i18n="menu.settings">Settings</button>
        <button id="exit-app" class="menu-button" data-i18n="menu.exit" hidden>Exit</button>
    </div>

    <div class="main-menu-content" data-screen="endless" hidden>
        <button class="menu-back" data-back data-i18n="menu.back">← Back</button>
        <h1 data-i18n="menu.endless">Endless</h1>
        <button id="open-generator" class="menu-gear" data-i18n-title="menu.generator" title="Map generator">⚙️</button>

        <button id="play-button" data-i18n="menu.play">PLAY</button>

        <div class="wave-settings">
            <div data-i18n="menu.difficulty">Difficulty:</div>
            <div class="wave-options" id="difficulty-options">
                <button class="difficulty-option" data-difficulty="easy" data-i18n="menu.easy">Easy</button>
                <button class="difficulty-option active" data-difficulty="normal" data-i18n="menu.normal">Normal</button>
                <button class="difficulty-option" data-difficulty="hard" data-i18n="menu.hard">Hard</button>
            </div>
        </div>

        <div class="wave-settings">
            <div data-i18n="menu.waveInterval">Wave interval (s):</div>

            <div class="wave-options">
                <button class="wave-option active" data-wave-interval="90">90</button>
                <button class="wave-option" data-wave-interval="120">120</button>
                <button class="wave-option" data-wave-interval="180">180</button>
                <button class="wave-option" data-wave-interval="custom" data-i18n="menu.custom">Custom</button>
            </div>
            <input id="wave-custom" class="menu-number" type="number" min="20" max="600" step="10" value="150" hidden />
        </div>

        <div class="wave-settings">
            <div data-i18n="menu.mapSize">Map size:</div>

            <div class="wave-options">
                <button class="map-option" data-map-size="30" data-i18n="menu.mapSmall">Small</button>
                <button class="map-option active" data-map-size="40" data-i18n="menu.mapMedium">Medium</button>
                <button class="map-option" data-map-size="60" data-i18n="menu.mapLarge">Large</button>
                <button class="map-option" data-map-size="custom" data-i18n="menu.mapCustom">Custom</button>
            </div>
            <div class="map-custom" hidden>
                <input id="map-cols" class="menu-number" type="number" min="20" max="100" value="50" /> ×
                <input id="map-rows" class="menu-number" type="number" min="20" max="100" value="50" />
            </div>
        </div>

        <div class="seed-settings">
            <label for="seed-input" data-i18n="menu.seed">World seed</label>
            <div class="seed-row">
                <input id="seed-input" type="text" value="default-world-seed" />
                <button id="seed-reroll" type="button" data-i18n-title="menu.newSeed" title="New random seed" aria-label="New random seed">🔄</button>
            </div>
        </div>
    </div>

    <div class="main-menu-content generator-screen" data-screen="generator" hidden>
        <button class="menu-back" data-back-to="endless" data-i18n="menu.back">← Back</button>
        <h1 data-i18n="menu.generator">Map generator</h1>
        <div class="preset-row">
            <button id="preset-standard" class="fps-option" data-i18n="gen.standard">Standard</button>
            <input id="preset-name" class="menu-number" type="text" maxlength="24" data-i18n-placeholder="gen.presetName" placeholder="Preset name" />
            <button id="preset-save" class="fps-option" data-i18n="gen.save">Save</button>
        </div>
        <div id="preset-list" class="preset-list"></div>
        <div id="generator-fields" class="generator-fields"></div>
    </div>

    <div class="main-menu-content" data-screen="settings" hidden>
        <button class="menu-back" data-back data-i18n="menu.back">← Back</button>
        <h1 data-i18n="menu.settings">Settings</h1>

        <div class="wave-settings">
            <div data-i18n="menu.language">Language:</div>
            <div class="wave-options" id="language-options"></div>
        </div>

        <div class="wave-settings">
            <div data-i18n="menu.fps">Frame rate:</div>
            <div class="wave-options" id="fps-options">
                <button class="fps-option" data-fps="30">30</button>
                <button class="fps-option" data-fps="60">60</button>
                <button class="fps-option" data-fps="display" data-i18n="menu.fpsDisplay">Screen</button>
            </div>
        </div>

        <div class="wave-settings">
            <div data-i18n="menu.showFps">Show FPS:</div>
            <div class="wave-options" id="show-fps-options">
                <button class="fps-option" data-show-fps="off" data-i18n="menu.off">Off</button>
                <button class="fps-option" data-show-fps="on" data-i18n="menu.on">On</button>
            </div>
        </div>
    </div>
</div>

<div id="pause-menu" class="menu-overlay" hidden>
    <div class="main-menu-content">
        <h1 data-i18n="pause.title">Paused</h1>
        <button id="resume-button" class="menu-button menu-button-primary" data-i18n="pause.continue">Continue</button>
        <button id="exit-to-menu-button" class="menu-button" data-i18n="pause.exit">Exit to main menu</button>
    </div>
</div>

<div id="game-container">

  <div id="top-bar">
    <div class="top-wave">
      🌊 <span data-i18n="top.wave">Wave</span> <span id="wave-num">1</span> (<span id="wave-timer">90</span><span data-i18n="top.seconds">s</span>)
    </div>

    <button class="btn-pause-square" id="btn-pause-toggle" onclick="togglePause()" data-i18n-title="pause.pauseHint" title="Pause [Space]">⏸️</button>

    <div class="top-actions">
      <button class="btn btn-unpossess" onclick="switchPossession()">👁️</button>
    </div>
  </div>

  <div id="main-area">
    <div id="toast-notification"></div>
    <div id="fps-counter" hidden></div>

    <div style="position: absolute; top: 8px; left: 10px; z-index: 5; font-size: 10px; color: rgba(255, 255, 255, 0.35); pointer-events: none; user-select: none; text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);">
      <span id="hud-seed">-</span>
    </div>

    <div id="zoom-controls">
      <button class="btn-zoom" onclick="zoomIn()" data-i18n-title="top.zoomIn" title="Zoom in">
        ➕
      </button>
      <button class="btn-zoom" onclick="zoomOut()" data-i18n-title="top.zoomOut" title="Zoom out">
        ➖
      </button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mobile-dpad">
      <button id="btn-w" class="dpad-btn up">▲</button>
      <div class="dpad-row">
        <button id="btn-a" class="dpad-btn left">◄</button>
        <button id="btn-s" class="dpad-btn down">▼</button>
        <button id="btn-d" class="dpad-btn right">►</button>
      </div>
    </div>

    <button class="btn active" id="btn-interact" onclick="setMode('interact')">
      <span class="fab-icon">👆</span>
      <span class="fab-label" data-i18n="top.point">Point</span>
    </button>
  </div>

  <div id="bottom-panel">

    <div id="selected-bar" class="selected-unit-box">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 11px; color: #aaa;"><span data-i18n="hud.selected">Selected:</span> <b id="selected-settler-txt" style="color: #f1c40f;">Nobody</b></span>
        <button class="btn" style="padding: 1px 5px; font-size: 10px; display: none;" id="btn-deselect" onclick="deselectSettler()">❌</button>
      </div>
      <button class="btn btn-armor" id="btn-upgrade-big" style="display: none;" onclick="upgradeToBig()"></button>
    </div>

    <div class="resources-grid" id="resources-hud"></div>

    <div class="recruit-row">
      <button class="btn" id="btn-hire-normal" onclick="spawnSettler('normal')"></button>
      <button class="btn" id="btn-hire-big" onclick="spawnSettler('big')"></button>
      <button class="btn btn-armor" id="btn-upgrade" onclick="upgradeToBig()"></button>
    </div>

    <div class="tab-navigation">
      <button class="tab-btn active" onclick="switchTab(this, 'tab-build')" data-i18n="tab.build">🏗️ Building</button>
      <button class="tab-btn" onclick="switchTab(this, 'tab-farming')" data-i18n="tab.farming">🌾 Farming</button>
      <button class="tab-btn" onclick="switchTab(this, 'tab-tools')" data-i18n="tab.tools">🛠️ Tools</button>
      <button class="tab-btn" onclick="switchTab(this, 'tab-weapons')" data-i18n="tab.weapons">⚔️ Weapons</button>
    </div>

    <div class="tab-content-container">

      <div id="tab-build" class="tab-pane active">
        <div class="btn-grid-2col" id="build-actions"></div>

        <div class="action-row">
          <button class="btn btn-demolish" id="btn-demolish" onclick="setMode('demolish')" data-i18n="btn.demolish">🔨 Demolish</button>
          <button class="btn" id="btn-repair-all" onclick="repairAllBuildings()" data-i18n="btn.repairAll">🛠️ Repair all</button>
        </div>
      </div>

      <div id="tab-farming" class="tab-pane">
        <div class="btn-grid-2col" id="farming-actions"></div>
        <div class="action-row">
          <button class="btn" id="btn-zone_wheat" onclick="setMode('zone_wheat')" data-i18n="btn.zoneWheat">🟨 Wheat zone</button>
          <button class="btn" id="btn-zone_sapling" onclick="setMode('zone_sapling')" data-i18n="btn.zoneSapling">🟩 Sapling zone</button>
          <button class="btn" id="btn-zone_apple" onclick="setMode('zone_apple')" data-i18n="btn.zoneApple">🟥 Apple zone</button>
          <button class="btn" id="btn-zone_clear" onclick="setMode('zone_clear')" data-i18n="btn.zoneClear">✖ Remove zone</button>
        </div>
      </div>

      <div id="tab-tools" class="tab-pane">
        <div class="btn-grid-2col" id="tool-actions"></div>

        <div class="btn-grid-2col gear-actions">
          <button class="btn" id="btn-backpack" onclick="orderGear('backpack')"></button>
          <button class="btn" id="btn-wateringCan" onclick="orderGear('wateringCan')"></button>
        </div>

        <div class="action-row">
          <button class="btn btn-disarm" onclick="orderGearOff('backpack')" data-i18n="btn.backpackOff">❌ Take backpack apart</button>
          <button class="btn btn-disarm" onclick="orderGearOff('wateringCan')" data-i18n="btn.wateringCanOff">❌ Take watering can apart</button>
          <button class="btn btn-disarm" onclick="disarmSettler('tool')" data-i18n="btn.disarmTool">❌ Take tool away</button>
        </div>
      </div>

      <div id="tab-weapons" class="tab-pane">
        <div class="btn-grid-2col" id="weapon-actions"></div>
        <div class="btn-grid-2col" id="special-actions">
          <button class="btn" id="btn-craft-arrows" onclick="craftArrows()"></button>
        </div>

        <div class="btn-grid-2col gear-actions">
          <button class="btn" id="btn-armor" onclick="orderGear('armor')"></button>
          <button class="btn" id="btn-shield" onclick="orderGear('shield')"></button>
        </div>

        <div class="action-row">
          <button class="btn btn-disarm" onclick="orderGearOff('armor')" data-i18n="btn.armorOff">❌ Take armour apart</button>
          <button class="btn btn-disarm" onclick="disarmSettler('weapon')" data-i18n="btn.disarmWeapon">❌ Take weapon away</button>
        </div>
      </div>

    </div>

  </div>
</div>

<script src="js/tabs.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/economy.js"></script>
<script src="js/state.js"></script>
<script src="js/world.js"></script>
<script src="js/movement.js"></script>
<script src="js/input.js"></script>
<script src="js/actions.js"></script>
<script src="js/combat.js"></script>
<script src="js/waves.js"></script>
<script src="js/ui.js"></script>
<script src="js/behaviours.js"></script>
<script src="js/update.js"></script>
<script src="js/render.js"></script>
<script src="js/main.js"></script>
<script src="js/generator.js"></script>

</body>
</html>
